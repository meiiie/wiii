# Ruff configuration for Wiii Service
# Only check real errors, not style — style rules are too noisy for this codebase.
# CI runs `ruff check app/` against this file, so every rule here is a gate.
# Widen step by step: enable a rule only once its findings are fixed.

[lint]
select = [
    "E9",     # Syntax / IO errors
    "F",      # Pyflakes — real bugs (unused variables, redefinitions, etc.)
    "E721",   # Type comparison using == instead of isinstance()
    "B005",   # str.strip() with a multi-character string (strips a char set)
    "B023",   # Closure captures a loop variable late
    "B033",   # Duplicate items in a set literal
]
ignore = [
    "F821",   # Undefined name — false positives from forward reference type annotations
    # Many modules re-export names that tests and callers patch; removing them
    # needs per-module `__all__` work. Next step of the Ruff widening.
    "F401",
]

# Per-file ignores for intentional patterns
[lint.per-file-ignores]
"app/engine/multi_agent/subagents/rag/graph.py" = ["F841"]   # query assigned for future use
"app/engine/multi_agent/subagents/tutor/graph.py" = ["F841"] # level assigned for future use
# Lazy runtime-binding modules resolve `__all__` names through module `__getattr__`.
"app/api/v1/admin_runtime_bindings.py" = ["F822"]
"app/engine/multi_agent/supervisor_runtime_bindings.py" = ["F822"]
"app/services/chat_service.py" = ["F822"]
"app/services/vision_processor_runtime_bindings.py" = ["F822"]
