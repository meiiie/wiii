name: Desktop Tests

on:
  push:
    branches: [main]
    paths:
      - 'wiii-desktop/**'
      - '.github/workflows/test-desktop.yml'
      - 'tools/release/prepare_neko_bundle.py'
  pull_request:
    branches: [main]
    paths:
      - 'wiii-desktop/**'
      - '.github/workflows/test-desktop.yml'
      - 'tools/release/prepare_neko_bundle.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wiii-desktop/package-lock.json

      - name: Install dependencies
        working-directory: wiii-desktop
        run: npm ci

      - name: Run tests with coverage
        working-directory: wiii-desktop
        run: npx vitest run --coverage

      - name: Type check
        working-directory: wiii-desktop
        run: npx tsc --noEmit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage
          path: wiii-desktop/coverage/
          retention-days: 7

  neko-contract:
    name: Neko Core ACP contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wiii-desktop/package-lock.json

      - name: Install dependencies
        working-directory: wiii-desktop
        run: npm ci

      - name: Prepare pinned Neko Core bundle
        run: python tools/release/prepare_neko_bundle.py --target linux-x64

      - name: Run ACP contract against the bundled binary
        working-directory: wiii-desktop
        env:
          WIII_NEKO_CONTRACT_BINARY: ${{ github.workspace }}/wiii-desktop/.build/neko-bundle/neko
        run: npx vitest run src/__tests__/neko-chill/neko-core-acp-contract.real.test.ts

  build-embed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wiii-desktop/package-lock.json

      - name: Install dependencies
        working-directory: wiii-desktop
        run: npm ci

      - name: Build embed bundle
        working-directory: wiii-desktop
        run: npm run build:embed

      - name: Validate embed output
        shell: bash
        run: |
          test -f wiii-desktop/dist-embed/embed.html
          test -f wiii-desktop/dist-embed/index.html

      - name: Upload embed artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-embed-dist
          path: wiii-desktop/dist-embed/
          retention-days: 7
