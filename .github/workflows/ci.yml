name: CI

on:
  push:
    branches: [main]
    paths:
      - 'maritime-ai-service/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maritime-ai-service/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff==0.17.6"

      - name: Run ruff check
        working-directory: maritime-ai-service
        run: ruff check app/ --output-format=github

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies and pip-audit
        working-directory: maritime-ai-service
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -r requirements.txt
          pip install pip-audit

      # Blocking gate: fix a finding by raising the dependency floor. If no fixed
      # release exists yet, add `--ignore-vuln <ID>` here with a comment naming
      # the advisory, why Wiii is not exposed, and the issue tracking removal.
      - name: Run pip-audit
        working-directory: maritime-ai-service
        shell: bash
        run: |
          set -o pipefail
          pip-audit --strict --desc on 2>&1 | tee pip-audit-results.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-results
          path: maritime-ai-service/pip-audit-results.txt
          retention-days: 30

  docker-build:
    name: Docker Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        working-directory: maritime-ai-service
        run: docker build -t wiii-service:ci-${{ github.sha }} .
