name: Computer Protocol Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/computer-contracts.yml'
      - 'wiii-desktop/src-tauri/src/neko/computer/image/**'
      - 'wiii-desktop/scripts/test-semantic-bridge-contract.py'
      - 'wiii-desktop/scripts/test-computer-control-transport.py'
      - 'wiii-desktop/scripts/test-computer-input-revocation.py'
      - 'wiii-desktop/scripts/test-work-plane-bridge.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/computer-contracts.yml'
      - 'wiii-desktop/src-tauri/src/neko/computer/image/**'
      - 'wiii-desktop/scripts/test-semantic-bridge-contract.py'
      - 'wiii-desktop/scripts/test-computer-control-transport.py'
      - 'wiii-desktop/scripts/test-computer-input-revocation.py'
      - 'wiii-desktop/scripts/test-work-plane-bridge.py'

permissions:
  contents: read

jobs:
  protocol-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install bridge test dependency
        run: python -m pip install --disable-pip-version-check websocket-client==1.9.0
      - name: Verify semantic and work-plane contracts without a live Computer
        run: |
          python -B wiii-desktop/scripts/test-semantic-bridge-contract.py -v
          python -B wiii-desktop/scripts/test-computer-input-revocation.py -v
          python -B wiii-desktop/scripts/test-work-plane-bridge.py -v

  control-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the actual Computer image
        run: docker build --tag wiii-computer-control:ci wiii-desktop/src-tauri/src/neko/computer/image
      - name: Verify kernel-enforced private control in a disposable container
        run: |
          docker run --rm --user 0:0 --network none --read-only \
            --cpus 1 --memory 256m --pids-limit 64 \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --tmpfs /run/wiii-control:rw,nosuid,nodev,noexec,mode=0700,size=1m \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --env WIII_ISOLATED_CONTROL_TEST=1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/wiii-desktop,target=/source,readonly" \
            --entrypoint python3 wiii-computer-control:ci \
            -B /source/scripts/test-computer-control-transport.py
